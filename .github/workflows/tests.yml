name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run API and browser tests
        run: >
          python -m pytest -q
          api_tests/test_education_api.py
          api_tests/test_payment_api.py
          api_tests/test_salary_payment_api.py
          api_tests/test_school_fees.py
          Test